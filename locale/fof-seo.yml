        which_extension_heading: 'ควรลงโปรแกรมส่วนขยายแผนผังเว็บไซต์ใดเพิ่มเติม?'
        why_body: 'Sitemap คือไฟล์เอกสารแบบ XML ที่รวมทุกหน้าต่างการเข้าถึงเนื้อหาบนเว็บไซต์ของคุณเอาไว้ในรายการเดียว เพื่อช่วยให้โปรแกรมสแกนข้อมูลและบอทสืบค้นจากค่ายต่างๆ ค้นพบและเข้าใจหน้าเว็บทั้งหมดของคุณเพื่อดึงไปทำคะแนนหน้าค้นหาได้อย่างมีประสิทธิภาพ'
        why_heading: 'ทำไมการมีแผนผังเว็บไซต์ (Sitemap) จึงสำคัญเป็นพิเศษ?'
      ssl:
        added_heading: 'ตกลง ฉันได้ติดตั้งและเปิดใช้ระบบ SSL เรียบร้อยแล้ว!'
        how_body: 'หากคุณเช่าพื้นที่บริการเว็บโฮสติ้งสำเร็จรูปทั่วไป วิธีการที่สะดวกที่สุดคือการเปิดแถบเมนูควบคุมโฮสติ้งของตัวเว็บไซต์ เลือกตัวเลือกการตั้งค่าโดเนมและกดคลิกตัวเลือกเปิดใช้งาน SSL หรือ Let''s Encrypt เพื่อขอรับใบรับรองฟรี ซึ่งโฮสติ้งเกือบทั้งหมดในปัจจุบันจะพร้อมมีส่วนช่วยเหลือการขอรับใบรับรองของทางค่าย {link}'
        how_heading: 'วิธีการเพิ่มใบรับรอง SSL เข้ากับเว็บบอร์ดของคุณ'
        intro_body: 'ความกังวลและความปลอดภัยด้านสิทธิความเป็นส่วนตัวบนอินเทอร์เน็ตทวีความสำคัญขึ้นทุกวัน ทั้งฝั่งผู้ใช้งานทั่วไปรวมถึงนักพัฒนาเว็บต่างก็มุ่งหวังให้ระบบการเข้าชมบอร์ดมีความปลอดภัย เพื่อให้เกิดความมั่นใจในทุกการพิมพ์ล็อกอินหรือกรอกข้อมูลว่าจะไม่โดนลอบดักจารกรรมระหว่างทางโดยผู้ไม่หวังดี'
        intro_heading: 'ทำไมเว็บไซต์จึงจำเป็นต้องมีโปรโตคอลเชื่อมต่อปลอดภัย?'
        no_ssl_body: 'ในสถานการณ์นี้ คุณควรลบส่วนขยายเสริม SEO นี้ทิ้งออกไปได้เลย เนื่องจาก Search Engines ยักษ์ใหญ่ระดับสากล <b>จะไม่นำระบบบอร์ดสนทนาของคุณเข้าสู่ทำดัชนีผลค้นหา</b> หรือจะปัดอันดับคุณไปอยู่รั้งท้ายสุดเนื่องจากข้อกำหนดเรื่องความปลอดภัยพื้นฐาน'
        no_ssl_heading: 'จะเกิดอะไรขึ้นหากฉันเลือกที่จะปฏิเสธและไม่ต้องการลงระบบ SSL?'
        rankings_body: 'หากเว็บบอร์ดของคุณไม่รองรับหรือไม่มีความพร้อมสำหรับการเชื่อมต่อแบบ HTTPS (SSL/TLS) โปรแกรมค้นหาแทบทุกค่ายจะลดชั้นหรือจัดอันดับคุณให้อยู่ท้ายสุด หรืออาจถึงขั้นถอดบอร์ดของคุณออกจากสารระบบค้นหาเพื่อความปลอดภัยของสมาชิก'
        rankings_body_ssl: 'เมื่อคุณอัปเกรดติดตั้งใช้งาน SSL หน้าเว็บบอร์ดของคุณจะได้รับคะแนนด้านความปลอดภัยที่ดีและมีโอกาสสูงที่จะติดคำค้นหาและแสดงผลอันดับต้นๆ บนหน้า Google'
        rankings_heading: 'Search Engines {icon} ให้ความสำคัญและจัดลำดับสิทธิ์เหนือกว่าแก่เว็บที่ปลอดภัย'
        what_body: 'คนทั่วไปมักจดจำในชื่อ <b>https</b> ที่เป็นคำนำหน้าการเชื่อมต่อปลอดภัยว่าคือ SSL: <i>Secure Sockets Layer</i> แต่ในมาตรฐานสากลปัจจุบันทางการจะเรียกว่า TLS: <i>Transport Layer Security</i> ระบบจะทำหน้าที่เข้ารหัสข้อมูลระหว่างเว็บเบราว์เซอร์ของผู้ใช้และเซิร์ฟเวอร์เพื่อไม่ให้ใครดักฟังสัญญาณกลางทางได้ หากพบความปลอดภัยต่ำหรือมีผู้ลักลอบสวมรอยระบบความปลอดภัยจะตัดขาดทันทีและเบราว์เซอร์จะขึ้นแจ้งเตือนระบบไม่ปลอดภัยแก่ผู้ใช้งานทันที'
        what_heading: 'ทำความเข้าใจระบบ SSL หรือ TLS?'
